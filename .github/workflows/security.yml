# =============================================================================
# Seguridad de dependencias
# =============================================================================
# `npm audit` en cada PR/push y cada lunes: rompe si hay HIGH o CRITICAL.
# El escaneo semanal existe porque una vulnerabilidad nueva aparece sin que
# nadie toque el repo.
#
# Después informa (sin romper) de si los `overrides` siguen haciendo falta:
# un override obsoleto es deuda, no un fallo de seguridad (ver la cabecera de
# scripts/verificar-overrides.mjs).
# =============================================================================
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias (sin scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: npm audit (HIGH o superior rompe)
        run: npm audit --audit-level=high

      - name: ¿Siguen haciendo falta los overrides?
        run: npm run deps:overrides
