<!doctype html>
<html lang="es">
  <body style="margin:0;padding:32px 16px;background:#05010f;color:#e6e6f0;font-family:Inter,Segoe UI,Arial,sans-serif">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto">
      <tr>
        <td style="padding:24px;border:1px solid rgba(196,181,253,0.12);border-radius:16px;background:#0b0718">
          <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#b19eef">R3ZON Clientes</p>
          <h1 style="margin:0 0 16px;font-size:22px">Tu código de confirmación</h1>
          <p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#a1a1b2">
            Escríbelo en el área de clientes para confirmar que eres tú. Caduca en una hora y sirve una sola vez.
          </p>
          <p style="margin:0 0 16px;font-size:32px;font-weight:700;letter-spacing:0.3em;color:#ff9ffc">{{ .Token }}</p>
          <p style="margin:0;font-size:12px;line-height:1.5;color:#a1a1b2">
            Si no lo has pedido tú, ignora este email: nadie puede usar el código sin entrar en tu cuenta.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
